<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The strip in miniature: the voice kept above the line, the music removed below it. -->
  <rect width="32" height="32" rx="6" fill="#12110f"/>
  <g fill="#f0a23a">
    <rect x="6" y="11" width="3" height="4"/>
    <rect x="11" y="6" width="3" height="9"/>
    <rect x="16" y="9" width="3" height="6"/>
    <rect x="21" y="7" width="3" height="8"/>
  </g>
  <rect x="5" y="15.5" width="22" height="1" fill="#6b675d"/>
  <g fill="#7c97a8">
    <rect x="6" y="17" width="3" height="6"/>
    <rect x="11" y="17" width="3" height="4"/>
    <rect x="16" y="17" width="3" height="7"/>
    <rect x="21" y="17" width="3" height="5"/>
  </g>
</svg>
