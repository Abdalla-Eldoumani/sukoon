[project]
name = "sukoon"
version = "0.1.0"
description = "Remove the music from audio and video files and keep the voices, on your own computer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "audio-separator[cpu]==0.47.0",
    "audioread==3.1.0",  # audio-separator imports it without declaring it
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "numpy==2.5.3",
    "soundfile==0.14.0",
]

[project.optional-dependencies]
cpu = ["torch==2.14.1", "torchvision==0.29.1"]
cuda = ["torch==2.14.1", "torchvision==0.29.1"]

[project.scripts]
sukoon = "sukoon.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sukoon"]
artifacts = ["src/sukoon/web_dist/**"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu126", extra = "cuda" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu126", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S310", "RUF001"]
"scripts/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["audio_separator.*", "soundfile.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model and not slow'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = [
    "model: runs the real separation models (set SUKOON_TEST_MODELS=1)",
    "slow: takes more than a few seconds",
]
